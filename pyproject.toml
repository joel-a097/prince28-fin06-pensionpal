
[project]
name = "pensionpal"
version = "0.1.0"
description = "PensionPal - EPF and pension assistance API"
readme = "README.md"
authors = [
    { name = "Joel", email = "joel097a@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.164.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pensionpal = "pensionpal:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
