
[project]
name = "pensionpal"
version = "0.1.0"
description = "PensionPal - EPF and pension assistance API"
readme = "README.md"
authors = [
    { name = "Joel", email = "joel097a@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.164.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "protego>=0.7.0",
    "pydantic-settings>=2.16.3",
    "pymupdf>=1.26,<2",
    "pypdf>=7.1.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "trafilatura>=2.4.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pensionpal = "pensionpal:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
exclude = ["migrations/versions"]

[tool.ruff.lint]
extend-ignore = ["E402"]

[tool.coverage.run]
source = ["pensionpal"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.poe.tasks]
dev = "uvicorn pensionpal.api.main:create_app --factory --reload --no-access-log"
worker = "arq pensionpal.workers.main.WorkerSettings"
lint = ["_ruff_check", "_ruff_format"]
_ruff_check = "ruff check ."
_ruff_format = "ruff format --check ."
test = "pytest tests/unit"
cov = "pytest --cov --cov-report=term-missing"
migrate = "alembic upgrade head"
seed = "python scripts/load_db.py"

[tool.poe.tasks.test-integration]
help = "Integration tests against the Postgres from docker compose (run `docker compose up -d` first)"
cmd = "pytest tests/integration"
env.TEST_DATABASE_URL.default = "postgresql://app:app@localhost:5433/app_test"  # pragma: allowlist secret
